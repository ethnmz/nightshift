# Nightshift night config. Commit this file; every node reads the same copy.
version: 1
project: my-hackathon-project
night: auto            # "auto" = this evening's date; the integration branch is night/<date>
base_branch: main      # never written to overnight
remote: origin

# The team board. GitHub issue (like the old tools/board) or a shared file for rehearsals.
board:
  kind: github
  repo: OWNER/REPO     # leave out to read it from the git remote
  issue: 1

# One node per teammate, each on their own Mac with their own `gh` login and Claude account.
nodes:
  - { id: ethan,  name: Ethan,  login: GITHUB_LOGIN, lanes: [frontend] }
  - { id: diego,  name: Diego,  login: GITHUB_LOGIN, lanes: [voice] }
  - { id: akshi,  name: Akshi,  login: GITHUB_LOGIN, lanes: [ai] }
  - { id: aditri, name: Aditri, login: GITHUB_LOGIN, lanes: [core] }

# Evening pre-authorization. These are the decisions humans used to make on the board.
# All must be true before a night can start, so nothing overnight waits on a person.
authorize:
  board_posts: true             # agents post and answer on the board without approval
  merge_to_night_branch: true   # green + reviewed work merges into night/<date> (never main)
  work_stealing: true           # an idle node takes ready tasks from another lane (no lead approval)
  contract_changes: true        # the contract lane may apply requested contract changes
  decide_with_assumptions: true # agents decide unspecified details, record them for the morning

check: "npm test"               # global check after every task (one-shot; no servers or watchers)
gate:                           # integration gate every N merges by a node; failure queues a fixer
  command: "npm test && npm run build"
  every: 3

concurrency: 2                  # agents per Mac
budget: { node_usd: 25, team_usd: 100 }
limits:
  task_minutes: 45
  max_turns: 80
  stuck_minutes: 12             # no agent activity for this long → kill and retry
  stale_claim_minutes: 20       # a node that stops heartbeating loses its tasks to others
  heartbeat_seconds: 60
  command_timeout_seconds: 900
  retries: 1
models:                         # leave blank for the Claude Code default
  builder: claude-opus-5-5
  reviewer: claude-sonnet-5-5
  planner: claude-opus-5-5
review: { enabled: true, max_rounds: 2 }
steal: { never_lanes: [], idle_seconds: 30 }
contracts: [docs/API.md, docs/DATA_MODEL.md]
contract_lane: core             # which lane applies contract-change requests
allow_commands: []              # empty = the safe default list (git, node/npm/npx, python/pytest/pip/uv, coreutils)
poll_seconds: 20
adapter: claude                 # "fake" = rehearsal with no model calls
dashboard_port: 4545
