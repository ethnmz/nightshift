# Relay run config. Commit this file; every computer reads the same copy.
version: 1
project: my-hackathon-project
run_id: auto           # "Share with the team" sets a new id (YYYY-MM-DD-HHMM) per plan; the integration branch is relay/<run_id>
base_branch: main      # agents never write to it
remote: origin

# The team board. GitHub issue (like the old tools/board) or a shared file for rehearsals.
board:
  kind: github
  repo: OWNER/REPO     # leave out to read it from the git remote
  issue: 1

# One node per teammate, each on their own Mac with their own `gh` login.
# agent: which coding agent that Mac runs on its owner's subscription:
#   claude = Claude Code (log in once with `claude` → /login, Pro/Max/Team plan)
#   codex  = OpenAI Codex CLI (`npm i -g @openai/codex`, then `codex login` with ChatGPT)
nodes:
  - { id: ethan,  name: Ethan,  login: GITHUB_LOGIN, lanes: [frontend], agent: claude }
  - { id: diego,  name: Diego,  login: GITHUB_LOGIN, lanes: [voice],    agent: claude }
  - { id: akshi,  name: Akshi,  login: GITHUB_LOGIN, lanes: [ai],       agent: codex }
  - { id: aditri, name: Aditri, login: GITHUB_LOGIN, lanes: [core],     agent: claude }

# subscription = agents use each teammate's own Claude/ChatGPT plan login. API keys are removed
# from the agents' environment, so nothing is billed per use. (api_key = pay-per-use keys.)
auth: subscription
# When a plan's usage limit is hit, that node releases its tasks to the others and pauses until
# the limit resets (or this many minutes if the agent does not say when).
usage_limit_pause_minutes: 30

# Standing pre-authorization. These are the decisions humans used to make on the board.
# All must be true before a run can start, so nothing during it waits on a person.
authorize:
  board_posts: true             # agents post and answer on the board without approval
  merge_to_run_branch: true   # green + reviewed work merges into relay/<run_id> (never main)
  work_stealing: true           # an idle node takes ready tasks from another lane (no lead approval)
  contract_changes: true        # the contract lane may apply requested contract changes
  decide_with_assumptions: true # agents decide unspecified details, record them for the team to review

check: "npm test"               # global check after every task (one-shot; no servers or watchers)
gate:                           # integration gate every N merges by a node; failure queues a fixer
  command: "npm test && npm run build"
  every: 3

concurrency: 2                  # agents per Mac
# Usage cap. Measured as Claude Code's estimate at API prices. On subscriptions nothing is billed;
# this just stops one node from using its whole plan in one run. (Codex reports tokens, not $.)
budget: { node_usd: 25, team_usd: 100 }
limits:
  task_minutes: 45
  max_turns: 80
  stuck_minutes: 12             # no agent activity for this long → kill and retry
  stale_claim_minutes: 20       # a node that stops heartbeating loses its tasks to others
  heartbeat_seconds: 60
  command_timeout_seconds: 900
  retries: 1
models:                         # Claude model per role (Codex nodes use `model:` on the node, or their default)
  builder: claude-opus-5-5
  reviewer: claude-sonnet-5-5
  planner: claude-opus-5-5
review: { enabled: true, max_rounds: 2 }
steal: { never_lanes: [], idle_seconds: 30 }
contracts: [docs/API.md, docs/DATA_MODEL.md]
contract_lane: core             # which lane applies contract-change requests
allow_commands: []              # empty = the safe default list (git, node/npm/npx, python/pytest/pip/uv, coreutils)
poll_seconds: 20
adapter: claude                 # default agent for nodes without `agent:`; "fake" = rehearsal, no model calls
dashboard_port: 4545
